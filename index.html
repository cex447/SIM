<!DOCTYPE html>

<html data-view="plastic" lang="ca">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#000000" name="theme-color"/>
<meta content="SIM+" name="apple-mobile-web-app-title"/>
<meta content="SIM+" name="application-name"/>
<title>SIM+</title>
<link href="assets/icons/favicon.ico" rel="icon" sizes="any"/>
<link href="assets/icons/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="assets/icons/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png"/>
<link href="assets/icons/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
<link href="site.webmanifest" rel="manifest"/>
<link href="css/sim.css?v=3.15.0" rel="stylesheet"/>
</head>
<body>
<div id="app">
<header class="top">
<div class="topline">
<button aria-label="Activar o aturar música de fons" class="brand" id="brandAudioToggle" type="button">SIM+</button>
<div class="clock" id="clock">--:--:--</div>
</div>

<div class="query-bar lit-query-bar" hidden="" id="litQueryBar">
<div class="query-input-wrap">
<input aria-label="Cercar circulació" autocapitalize="characters" autocomplete="off" class="query-code-input circulation-input" id="circulationInput" inputmode="text" maxlength="4" spellcheck="false"/>
</div>
<div class="query-meta" hidden="" id="queryMeta">
<span class="query-status" hidden="" id="queryStatus"></span>
<span class="query-unit" hidden="" id="queryUnit"></span>
<span class="query-occupancy occupancy" hidden="" id="queryOccupancy"></span>
<span class="query-delay" hidden="" id="queryDelay"></span>
</div>
</div>
<div class="query-bar isic-query-bar" hidden="" id="isicQueryBar">
<div class="query-input-wrap">
<input aria-label="Codi d'estació iSIC" autocapitalize="characters" autocomplete="off" class="query-code-input station-input" id="stationInput" inputmode="text" maxlength="2" spellcheck="false"/>
</div>
<div aria-live="polite" class="station-query-name" id="stationName"></div>
</div>
</header>
<main><section class="view active" id="view-plastic">
<div class="plastic-filters">
<div aria-label="Línies" class="line-filters" id="lineFilters"></div>
<div aria-hidden="true" class="landscape-filter-gap"></div>
<div class="ut-filter-line">
<div aria-label="Sèries UT" class="ut-filters" id="utFilters"></div>
<button aria-pressed="true" class="text-filter all-filter selected" id="clearPlasticFilters" type="button"><span class="plate-label">TOTS</span></button>
</div>
</div>
<div aria-live="polite" class="plastic-status" id="plasticStatus">ESPERANT DADES</div>
<div class="plastic-directions">
<section class="plastic-direction" id="ascDirection">
<h2 class="direction-title"><span id="ascLabel">ASCENDENTS</span> <span class="direction-count" id="ascCount">0 UTs</span></h2>
<div id="ascList"></div>
<div class="empty" hidden="" id="ascEmpty"></div>
</section>
<section class="plastic-direction" id="descDirection">
<h2 class="direction-title">DESCENDENTS <span class="direction-count" id="descCount">0 UTs</span></h2>
<div id="descList"></div>
<div class="empty" hidden="" id="descEmpty"></div>
</section>
</div>
</section><section class="view" id="view-isic">
<div aria-live="polite" class="plastic-status isic-status" id="isicStatus">INTRODUEIX EL CODI D'ESTACIÓ</div>
<div class="plastic-directions isic-directions" id="isicDirections">
<section class="plastic-direction" id="isicAscDirection">
<h2 class="direction-title"><span id="isicAscLabel">ASCENDENTS</span> <span class="direction-count" id="isicAscCount">0 UTs</span></h2>
<div id="isicAscList"></div>
<div class="empty" hidden="" id="isicAscEmpty"></div>
</section>
<section class="plastic-direction" id="isicDescDirection">
<h2 class="direction-title">DESCENDENTS <span class="direction-count" id="isicDescCount">0 UTs</span></h2>
<div id="isicDescList"></div>
<div class="empty" hidden="" id="isicDescEmpty"></div>
</section>
</div>
</section><section class="view ctc-view" data-viewport-max="3.0" data-viewport-min="0.08" id="view-ctc">
<div aria-label="Sinòptic CTC Barcelona-Vallès" class="ctc-map-stage" id="ctcMapStage">
<img alt="Sinòptic ferroviari Barcelona-Vallès" class="ctc-map-image" id="ctcMapImage" src="assets/ctc/sinoptico-bv.svg?v=3.15.0"/>
<div aria-hidden="true" class="ctc-train-layer" id="ctcTrainLayer"></div>
</div>
</section><section class="view" id="view-lit">
<div class="lit-route" id="litRoute"></div>
</section><section class="view" id="view-siv">
<div class="siv-placeholder">SIV</div>
</section></main>
<nav aria-label="Mòduls SIM+" class="tabs tabs-global">
<button class="tab active" data-view="plastic" type="button"><span class="plate-label">PLASTIC</span></button>
<button class="tab" data-view="isic" type="button"><span class="plate-label">iSIC</span></button>
<button class="tab" data-view="ctc" type="button"><span class="plate-label">CTC</span></button>
<button class="tab" data-view="lit" type="button"><span class="plate-label">LIT</span></button>
<button class="tab" data-view="siv" type="button"><span class="plate-label">SIV</span></button>
</nav>
<button aria-label="Diagnòstic" id="diagHotspot" type="button"></button>
<dialog id="diag">
<div class="diaghead">
<strong>SIM+ DIAGNÒSTIC</strong>
<button aria-label="Tancar" id="closeDiag" type="button">×</button>
</div>
<pre id="diagText"></pre>
</dialog>
</div>
<script src="js/app.js?v=3.15.0" type="module"></script>
</body>
</html>
