<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <title>SIM+</title>
  <link rel="stylesheet" href="css/sim.css?v=3.4.0">
</head>

<body>
<div id="app">
  <header class="top">
    <div class="topline">
      <button
        id="brandAudioToggle"
        class="brand"
        type="button"
        aria-label="Pausa o reprèn l'àudio de fons"
      >SIM+</button>

      <div id="clock" class="clock" aria-label="Hora actual">--:--:--</div>
    </div>

    <nav class="tabs" aria-label="Mòduls SIM+">
      <button data-view="lit" class="tab" type="button">LIT</button>
      <button data-view="puv" class="tab active" type="button">PUV</button>
      <button data-view="ema" class="tab" type="button">EMA</button>
    </nav>

    <div id="queryBar" class="query-bar">
      <div class="query-input-wrap">
        <input
          id="circulationInput"
          inputmode="text"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          maxlength="4"
          aria-label="Cercar circulació"
        >
      </div>

      <div id="queryMeta" class="query-meta" hidden>
        <span id="queryStatus" class="query-status" hidden></span>
        <span id="queryUnit" class="query-unit" hidden></span>
        <div id="queryOccupancy" class="query-occupancy" hidden></div>
      </div>
    </div>
  </header>

  <main>
    <section id="view-lit" class="view">
      <div id="litRoute" class="lit-route" aria-live="polite"></div>
    </section>

    <section id="view-puv" class="view active">
      <div class="puv-filters">
        <div id="lineFilters" class="filterrow line-filters"></div>

        <div class="landscape-filter-gap" aria-hidden="true"></div>

        <div class="ut-filter-line">
          <div id="utFilters" class="filterrow ut-filters"></div>
          <button id="clearPuvFilters" class="text-filter all-filter" type="button">
            TOTS
          </button>
        </div>

        <div id="puvStatus" class="puv-status" aria-live="polite">
          ESPERANT DADES
        </div>
      </div>

      <div class="puv-directions">
        <section class="puv-direction" aria-labelledby="ascTitle">
          <h2 id="ascTitle" class="direction-title">ASCENDENTS</h2>
          <div id="ascList"></div>
          <div id="ascEmpty" class="empty" hidden></div>
        </section>

        <section class="puv-direction" aria-labelledby="descTitle">
          <h2 id="descTitle" class="direction-title">DESCENDENTS</h2>
          <div id="descList"></div>
          <div id="descEmpty" class="empty" hidden></div>
        </section>
      </div>
    </section>

    <section id="view-ema" class="view">
      <div class="essais">ESSAIS</div>
    </section>
  </main>

  <button id="diagHotspot" type="button" aria-label="Diagnòstic"></button>

  <dialog id="diag">
    <div class="diaghead">
      <strong>SIM+ DIAGNÒSTIC</strong>
      <button id="closeDiag" type="button" aria-label="Tancar">×</button>
    </div>
    <pre id="diagText"></pre>
  </dialog>
</div>

<script type="module" src="js/app.js?v=3.4.0"></script>
</body>
</html>
