<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIM+ Alpha 1.0</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666}
@media (prefers-color-scheme: dark){
:root{--bg:#111;--fg:#f0f0f0;--muted:#8a8a8a}
}
body{background:var(--bg);color:var(--fg);font-family:Menlo,Consolas,monospace;margin:20px}
.row{display:flex;gap:14px;padding:6px 0;white-space:nowrap}
.circ{width:52px;font-weight:bold}.mat{width:70px}.rec{width:70px;color:var(--muted)}.pos{width:80px}
.occ{display:flex;gap:2px}.box{width:12px;height:12px;border-radius:2px}.empty{width:12px;height:12px;border:1px solid #808080}
</style>
</head>
<body>
<h1>SIM+ Alpha 1.0</h1>
<p>Prototipo visual.</p>
<div id="list"></div>
<script>
const colors={S1:"#ff8a05",S2:"#39d40f",L6:"#7c4dbf",L7:"#805234",L12:"#b381db"};
const demo=[
{circulacion:"D103",linea:"S1",material:"112.08",recorrido:"PC→NA",posicion:"RB→FN",ocupacion:[10,35,60,90]},
{circulacion:"F324",linea:"S2",material:"113.19",recorrido:"PN→PC",posicion:"CF→SQ",ocupacion:null},
{circulacion:"B503",linea:"L7",material:"113.12",recorrido:"PC→TB",posicion:"PM→PD",ocupacion:[20,55,80,90]}
];
function occColor(p){if(p<25)return "#32CD32";if(p<50)return "#FFEB3B";if(p<75)return "#FF9800";return "#FF0000";}
const list=document.getElementById("list");
demo.forEach(t=>{
 const row=document.createElement("div"); row.className="row";
 row.innerHTML=`<span class="circ" style="color:${colors[t.linea]}">${t.circulacion}</span><span class="mat">${t.material}</span><span class="rec">${t.recorrido}</span><span class="pos">${t.posicion}</span>`;
 const occ=document.createElement("span"); occ.className="occ";
 if(!t.ocupacion){for(let i=0;i<4;i++){let e=document.createElement("span");e.className="empty";occ.appendChild(e);}}
 else {t.ocupacion.forEach(v=>{let b=document.createElement("span");b.className="box";b.style.background=occColor(v);occ.appendChild(b);});}
 row.appendChild(occ); list.appendChild(row);
});
</script>
</body>
</html>
